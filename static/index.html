<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torrent Manager</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">Torrent Manager</span>
    <span class="conn" id="connDot"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="topbar-actions">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" id="search" placeholder="Search torrents  ( / )" autocomplete="off">
    </label>
    <button id="addBtn" class="btn btn-accent pill">Add</button>
    <button id="settingsBtn" class="btn btn-icon" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.6a1.6 1.6 0 0 0-1.5-1H1a2 2 0 1 1 0-4h.2A1.6 1.6 0 0 0 2.6 8a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 7 4.6h.1A1.6 1.6 0 0 0 8.6 3V2a2 2 0 1 1 4 0v.2A1.6 1.6 0 0 0 14 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
    </button>
    <div class="seg" id="themeToggle">
      <button data-theme-set="light" title="Light" aria-label="Light mode"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <button data-theme-set="dark" title="Dark" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <section class="nav-section">
      <div class="nav-head">Categories <button class="mini" data-manage="categories">edit</button></div>
      <div id="categoryFilters" class="nav"></div>
    </section>
    <section class="nav-section">
      <div class="nav-head">Tags <button class="mini" data-manage="tags">edit</button></div>
      <div id="tagFilters" class="nav"></div>
    </section>
    <section class="nav-section">
      <div class="nav-head">Saved views <button class="mini" data-manage="views">edit</button></div>
      <div id="viewList" class="nav"></div>
    </section>
  </aside>

  <main class="content">
    <div class="list-toolbar">
      <div class="chips" id="statusChips"></div>
      <div class="toolbar-right">
        <select id="sortKey" class="control" title="Sort by"></select>
        <button id="sortDir" class="btn sm" title="Sort direction">↓</button>
      </div>
    </div>
    <div class="task-list" id="tableBody"></div>
    <div class="empty" id="emptyState">
      <div class="loading"><span class="pixel-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="shimmer">No torrents yet</span></div>
    </div>
  </main>

  <aside class="drawer" id="drawer" hidden></aside>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<div class="context-menu" id="ctxMenu" hidden></div>
<div class="toasts" id="toasts"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
